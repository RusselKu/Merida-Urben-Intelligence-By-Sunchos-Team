services:
  # 1. ETL Pipeline Service (Official INEGI & SESNSP processing)
  etl-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merida_urban_etl
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./src:/app/src
      - ./sql:/app/sql
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app:/app/src/backend
    command: python -m src.etl.run_pipeline

  # 2. FastAPI Backend Service (Spatial Autocorrelation & PySAL Engine)
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merida_urban_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app:/app/src/backend
    command: uvicorn src.backend.main:app --host 0.0.0.0 --port 8000 --reload

  # 3. React + Vite Frontend Dashboard (MapLibre GL JS & Urban Analytics)
  frontend-ui:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: merida_urban_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0 --port 3000
    depends_on:
      - backend-api
